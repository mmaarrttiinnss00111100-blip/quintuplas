name: Build NDS
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - run: dkp-pacman -S --noconfirm --needed nds-dev
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: quintuplas-nds
          path: quintuplas.nds
