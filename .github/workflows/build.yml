name: Build NDS
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - run: dkp-pacman -S --noconfirm --needed nds-dev
      - name: Build
        run: |
          set -e
          EX=/opt/devkitpro/examples/nds
          T=$(find $EX -path '*hello_world/Makefile' | head -1)
          if [ -z "$T" ]; then T=$(grep -rl 'lnds9' $EX --include=Makefile | head -1); fi
          echo "template: $T"
          D=$(dirname "$T")
          rm -rf /tmp/hello
          mkdir -p /tmp/hello
          cp -r "$D"/. /tmp/hello/
          (cd /tmp/hello && make) || echo "hello de teste falhou"
          H=$(find /tmp/hello -maxdepth 1 -name '*.nds' | head -1)
          if [ -n "$H" ]; then cp "$H" "$GITHUB_WORKSPACE/hello_teste.nds"; fi
          rm -rf /tmp/quintuplas
          mkdir -p /tmp/quintuplas
          cp -r "$D"/. /tmp/quintuplas/
          rm -rf /tmp/quintuplas/source
          mkdir -p /tmp/quintuplas/source
          cp main.c /tmp/quintuplas/source/main.c
          cd /tmp/quintuplas
          echo '' | base64 -d > icon.bmp
          sed -i 's/\\n Conquista: %s\\n\\n /\\n\\n ~ %s ~\\n\\n /' source/main.c
          sed -i 's/^\(LIBS[[:space:]]*:=\)/\1 -lfat/' Makefile
          sed -i 's/^GAME_TITLE.*/GAME_TITLE := Quintuplas/; s/^GAME_SUBTITLE1.*/GAME_SUBTITLE1 := Jogo de escolhas/; s/^GAME_SUBTITLE2.*/GAME_SUBTITLE2 := As Quintuplas Essenciais/; s/^GAME_ICON.*/GAME_ICON := $(CURDIR)\/icon.bmp/' Makefile
          grep -n 'ICON\|GAME_\|^LIBS' Makefile || true
          make
          N=$(find /tmp/quintuplas -maxdepth 1 -name '*.nds' | head -1)
          echo "nds: $N"
          cp "$N" "$GITHUB_WORKSPACE/quintuplas.nds"
      - uses: actions/upload-artifact@v4
        with:
          name: quintuplas-nds
          path: |
            quintuplas.nds
            hello_teste.nds
